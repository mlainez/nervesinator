# lk2nd boots the first extlinux/extlinux.conf it finds on an ext2/3/4 partition.
# Place it at board/<id>/overlay/extlinux/extlinux.conf (the kernel and DTB in /boot of the rootfs).
timeout 1
default buildroot
menu title lk2nd boot menu

label buildroot
	kernel /boot/zImage
	fdt /boot/REPLACE_ME.dtb
	append console=tty0 root=/dev/mmcblk0pNN rootwait rw
