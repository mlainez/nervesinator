# Machine-readable state of one port. The orchestrator keeps it current; agents propose changes.
# Facts carry their source in the dossier; this file holds the values.
id: "@ID@"
created: "@DATE@"

device:
  serial: "@SERIAL@"
  manufacturer: ""
  model: ""                # ro.product.model
  codename: ""             # ro.product.device
  product: ""              # what the bootloader reports (fastboot getvar product / PIT), checked before writes
  second_stage_serial: ""  # USB serial of the second stage's own fastboot/ums (e.g. U-Boot), distinct from the vendor's
  second_stage_product: "" # its fastboot product, checked by safe-flash
  lk2nd_compatible: ""     # fastboot getvar lk2nd:compatible (<vendor>,<codename>); checked when lk2nd reports its SoC board as product
  qcom_ids: ""             # lk2nd's SMEM ids <chip>/<soc_rev>/<platform>/<subtype>, from its "Device info" log line
  soc: ""                  # e.g. qcom msm8916, mediatek mt8127
  arch: ""                 # armv7 | aarch64
  ram_mb: 0
  storage: ""              # emmc | ufs, size
  android_version: ""
  flash_mode: ""           # fastboot | samsung-download | mtk-fastboot | mtk-brom
  return_mode: ""          # reboot-mode target that reaches a flashable state with no keys:
                           # download (Samsung: heimdall) | bootloader (fastboot, stock or lk2nd)
  modes: {}                # name -> how to enter (keys / command), tested in M3
  bootimg: {}              # header_version, pagesize, base, offsets, dtb (appended|qcdt|v2), cmdline, footer
  partition_sizes: {}      # name -> bytes, when dossier/raw cannot give it (safe-flash size check)
  pmos_name: ""            # <vendor>-<codename> as named in pmaports, if any
  android_ab: unknown      # true when the phone has Android A/B slots (boot_a/boot_b): they get neutralised
  active_slot: ""          # _a | _b (getprop ro.boot.slot_suffix, fastboot getvar current-slot)

learner:
  teach: off               # off | on: lessons are given on request ("teach on", explain <topic>)
  level: ""                # beginner | intermediate | expert (asked when teaching is switched on)
  language: en
  accepted_costs: []       # the irreversible costs the user accepted at gate G1, e.g. [data-wipe, knox-warranty-fuse]

# The stage is not stored: tools/kit-next.sh derives it from the evidence on disk.
gates_passed: []           # G1 (go + accepted costs), G3 (publish). G2 is the user's write allowlist
checks: {}                 # proofs that leave no file, name -> "<proof>": stock_firmware, fwup_host,
                           # nerves_boot, upload, revert, charging, release, awesome_row

session:
  autonomy: attended                # attended | unattended | full (skills/autonomy)
  goal: ""                          # full autonomy: what "done" means
  since: ""
  set_by: ""                        # the user's words that switched it

safety:
  unbrick_kit_ready: false
  bootloader_unlocked: unknown      # unknown | no | yes | not-needed
  backups_verified: false
  # The writable partitions are not listed here: the user types `allow writes <partition…>
  # [no backup <partition…>]` at gate G2 (default boot + userdata), read by the guard and safe-flash.
  experiment_partition: ""          # boot: lk2nd or test images when there is no RAM boot
  ram_boot: unknown                 # fastboot-boot | lk2nd | none | unknown
  irreversible_done: []             # e.g. knox-fuse-tripped (recorded honestly)
  root: unknown                     # unknown | already | wanted | declined | not-possible | done
  root_method: ""                   # how root is obtained on this device (M3 research), e.g. custom recovery on recovery

path:
  scenario: ""                      # A (mainline device) | B (mainline SoC) | C (downstream)
  kernel_repo: ""
  kernel_ref: ""                    # tag or commit SHA
  kernel_config: ""                 # where the base config comes from
  dtb: ""
  bootloader: ""                    # stock | lk2nd | u-boot
  boot_method: ""                   # how we load our kernel (command)
  reference_system: ""              # the closest existing Nerves system (tools/scaffold-system.sh --list), or none
  nerves_layout: ""                 # recommended: userdata-subimage (nerves-system/android-ab-layouts.md)
  peripherals: []                   # the peripherals the user wants (charging always comes first)
  buildroot_branch: false           # true when the user also wants a buildroot-android board
  rootfs_placement: ""              # Buildroot branch only (port-playbook/decisions.md section 3)

repos:
  buildroot_android: ""             # fork URL used in ports/<id>/buildroot-android
  nerves_system: ""
