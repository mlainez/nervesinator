# host-check-fwup.conf: the layout scripts/host-check-fwup.sh checks (sourced by bash).
# All sizes and offsets are 512-byte blocks, as in fwup.conf.

# The target partition as Linux sees it (e.g. userdata), and where writes must stop: lower when a
# vendor tail sits at its end (MediaTek BMT pool: use the scatter file's size).
TARGET_BLOCKS=
LIMIT_BLOCKS=
MARGIN_BLOCKS=2048

# The U-Boot-format env written by fwup (uboot_setenv): offset and size in bytes
ENV_OFFSET=2048
ENV_BYTES=8192

# Boot slots: fat when fwup writes kernel/DTB/extlinux into FAT slots (nested partitions 1 and,
# after upgrade, 1 again for B), none when the bootloader reads them elsewhere
BOOT_FS=fat
BOOT_A=
BOOT_B=
BOOT_COUNT=
# Files fwup puts in each boot slot, checked against the build (space separated)
BOOT_FILES="zImage"
# Text each slot's extlinux.conf must contain (e.g. its root= or rootfs= device)
BOOT_A_MARKER=
BOOT_B_MARKER=

ROOTFS_A=
ROOTFS_B=
ROOTFS_COUNT=
APP=
APP_COUNT=

# What nerves_runtime must see on the device
DEVPATH=
APP_DEVPATH=
