# The prebuilt first-light and rescue initramfs the kit uses, per architecture (sourced by bash).
# Built from buildroot-android's configs/{firstlight,rescue}_{aarch64,armv7}_defconfig and
# published as release assets with SHA256SUMS. Empty PREBUILT_VERSION: no release yet, build from
# source (boot-test/test-images.md) or import a local build with fetch-prebuilt.sh --from-dir.
PREBUILT_REPO=Spin42/buildroot-android
PREBUILT_VERSION=
# Asset names: <image>-<arch>.cpio.gz, e.g. rescue-aarch64.cpio.gz
